<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เพื่อชุมชน — แอปเพื่อชุมชน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+Thai+Looped:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0D47A1;
    --navy-800:#1A237E;
    --navy-ink:#0B2E59;
    --bg:#F0F4F8;
    --card:#FFFFFF;
    --red:#D32F2F;
    --red-dark:#B71C1C;
    --green:#2E7D32;
    --orange:#E65100;
    --purple:#6A1B9A;
    --text-main:#1C2733;
    --text-sub:#5A6B7B;
    --line:#BBDEFB;
    --focus:#1976D2;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Noto Sans Thai', sans-serif;
    color:var(--text-main);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Noto Sans Thai Looped', 'Noto Sans Thai', sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:3px;
    border-radius:8px;
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg, var(--navy-900), var(--navy-ink));
    color:#fff;
    padding:22px 20px 30px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 6px 20px rgba(13,71,161,0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-inner{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .logo-badge{
    width:52px;height:52px;flex:none;
    border-radius:16px;
    background:rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  header h1{
    margin:0;
    font-size:clamp(22px,5vw,28px);
    font-weight:800;
    line-height:1.2;
  }
  header p{
    margin:2px 0 0;
    font-size:15px;
    color:rgba(255,255,255,0.72);
  }
  .clear-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:22px 18px 60px;
  }

  /* ---------- Emergency button ---------- */
  .emergency-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:18px;
    background:linear-gradient(135deg, var(--red), var(--red-dark));
    color:#fff;
    border:none;
    border-radius:22px;
    padding:22px 22px;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(211,47,47,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
    text-align:left;
    animation:pulse-shadow 2.6s ease-in-out infinite;
  }
  .emergency-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(211,47,47,0.45);
  }
  .emergency-btn:active{ transform:translateY(0); }
  @keyframes pulse-shadow{
    0%,100%{ box-shadow:0 10px 28px rgba(211,47,47,0.35); }
    50%{ box-shadow:0 10px 34px rgba(211,47,47,0.55); }
  }
  .emergency-icon{
    width:56px;height:56px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
  }
  .emergency-text .title{
    font-size:22px;
    font-weight:800;
    display:block;
  }
  .emergency-text .sub{
    font-size:15px;
    color:rgba(255,255,255,0.85);
    display:block;
    margin-top:2px;
  }

  /* ---------- Section title ---------- */
  .section-title{
    font-size:21px;
    font-weight:800;
    color:var(--navy-800);
    margin:30px 0 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ---------- Forms & Inputs ---------- */
  .post-form-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 26px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy-800);
    margin-bottom: 6px;
  }
  .form-control {
    width: 100%;
    padding: 12px;
    border: 1px solid #CFD8DC;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    background: #F8FAFC;
    color: var(--text-main);
  }
  .form-control:focus {
    outline: none;
    border-color: var(--navy-900);
    background: #fff;
  }
  .submit-btn {
    width: 100%;
    background: var(--navy-900);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit-btn:disabled {
    opacity: .6;
    cursor: progress;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text-sub);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--navy-800);
    color: white;
    border-color: var(--navy-800);
  }

  /* ---------- Announcement card (Dynamic) ---------- */
  .announce-card{
    margin-bottom:16px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:18px;
    padding:18px;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .announce-head{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:800;
  }
  .announce-head .ic{ font-size:24px; }
  .announce-head.alert { color: var(--red); }
  .announce-head.market { color: var(--orange); }
  .announce-head.announcement { color: var(--navy-900); }

  hr{
    border:none;
    border-top:1px solid #E3EAF1;
    margin:14px 0;
  }
  .announce-title{
    font-size:17px;
    font-weight:700;
    margin:0 0 4px;
    color:#1a1a1a;
  }
  .announce-body{
    font-size:15px;
    color:var(--text-sub);
    margin:0;
    line-height:1.55;
    white-space: pre-wrap;
  }
  .announce-meta {
    margin-top: 12px;
    font-size: 13px;
    color: #9AA7B4;
    display: flex;
    justify-content: space-between;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
  }

  .state-box {
    text-align: center;
    padding: 20px;
    color: var(--text-sub);
    font-size: 15px;
  }
  .state-box.error { color: var(--red); }

  footer{
    text-align:center;
    padding:24px 18px 34px;
    color:#8A97A5;
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-badge" aria-hidden="true">🏘️</div>
    <div>
      <h1>แอปเพื่อชุมชน</h1>
      <p>ใช้งานง่าย เพื่อทุกคนในบ้าน</p>
    </div>
  </div>
  <button class="clear-btn" id="refreshBtn" type="button">รีเฟรช</button>
</header>

<main>
  <button class="emergency-btn" type="button" id="emergencyBtn" aria-label="แจ้งเหตุฉุกเฉินด่วน กดตรงนี้เพื่อขอความช่วยเหลือ">
    <span class="emergency-icon" aria-hidden="true">⚠️</span>
    <span class="emergency-text">
      <span class="title">แจ้งเหตุฉุกเฉินด่วน</span>
      <span class="sub">กดตรงนี้เพื่อขอความช่วยเหลือ</span>
    </span>
  </button>

  <h2 class="section-title">สร้างประกาศใหม่</h2>

  <!-- Form สำหรับโพสต์ -->
  <div class="post-form-card">
    <form id="postForm">
      <div class="form-group">
        <label for="postAuthor">ชื่อผู้โพสต์</label>
        <input type="text" id="postAuthor" class="form-control" maxlength="60" placeholder="เช่น ป้าศรี" required>
      </div>
      <div class="form-group">
        <label for="postType">หมวดหมู่</label>
        <select id="postType" class="form-control" required>
          <option value="announcement">📢 ประกาศจากชุมชน</option>
          <option value="market">🛍️ ซื้อขาย / แลกเปลี่ยน</option>
          <option value="alert">⚡ แจ้งเหตุฉุกเฉิน</option>
        </select>
      </div>
      <div class="form-group">
        <label for="postTitle">หัวข้อ</label>
        <input type="text" id="postTitle" class="form-control" maxlength="200" placeholder="ระบุหัวข้อ..." required>
      </div>
      <div class="form-group">
        <label for="postContent">รายละเอียด</label>
        <textarea id="postContent" class="form-control" rows="3" maxlength="4000" placeholder="พิมพ์รายละเอียดที่นี่..." required></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">โพสต์ลงชุมชน</button>
    </form>
  </div>

  <h2 class="section-title">กระดานข่าวชุมชน</h2>

  <!-- แถบหมวดหมู่ -->
  <div class="tabs" id="filterTabs">
    <button class="tab-btn active" type="button" data-filter="all">🌐 ทั้งหมด</button>
    <button class="tab-btn" type="button" data-filter="announcement">📢 ประกาศ</button>
    <button class="tab-btn" type="button" data-filter="market">🛍️ ซื้อขาย</button>
    <button class="tab-btn" type="button" data-filter="alert">⚡ ฉุกเฉิน</button>
  </div>

  <!-- พื้นที่แสดงโพสต์ -->
  <div id="feedContainer" aria-live="polite"></div>

</main>

<footer>แพลตฟอร์มเพื่อชุมชน &middot; เวอร์ชันเว็บ</footer>

<script>
  const API = '/api/posts';

  // ชื่อผู้ใช้เก็บไว้ในเครื่อง เพื่อรู้ว่าโพสต์ไหนเป็นของเรา (ยังไม่มีระบบ login จริง)
  let currentUser = localStorage.getItem('community_app_user') || '';
  let currentFilter = 'all';
  let posts = [];

  const feedEl = document.getElementById('feedContainer');
  const authorEl = document.getElementById('postAuthor');
  const submitBtn = document.getElementById('submitBtn');

  authorEl.value = currentUser;

  // กัน XSS — เนื้อหามาจาก database ที่ทุกคนโพสต์ร่วมกัน
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatTime(iso) {
    const date = new Date(iso);
    return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
  }

  function getPostConfig(type) {
    switch (type) {
      case 'alert':  return { text: 'แจ้งเหตุฉุกเฉิน', icon: '⚠️', cssClass: 'alert' };
      case 'market': return { text: 'ซื้อขาย / แลกเปลี่ยน', icon: '🛍️', cssClass: 'market' };
      default:       return { text: 'ประกาศจากชุมชน', icon: '📢', cssClass: 'announcement' };
    }
  }

  function showState(message, isError) {
    feedEl.innerHTML = '<div class="state-box' + (isError ? ' error' : '') + '">' + escapeHtml(message) + '</div>';
  }

  async function request(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function loadPosts() {
    showState('กำลังโหลด...', false);
    try {
      const query = currentFilter === 'all' ? '' : '?type=' + encodeURIComponent(currentFilter);
      const data = await request(API + query);
      posts = data.posts;
      renderFeed();
    } catch (err) {
      showState('โหลดข้อมูลไม่สำเร็จ: ' + err.message, true);
    }
  }

  function renderFeed() {
    if (posts.length === 0) {
      showState('ยังไม่มีโพสต์ในหมวดหมู่นี้', false);
      return;
    }

    feedEl.innerHTML = posts.map(post => {
      const config = getPostConfig(post.type);
      const isOwner = currentUser && post.author === currentUser;

      return `
        <section class="announce-card">
          <div class="announce-head ${config.cssClass}">
            <span class="ic">${config.icon}</span>
            <span>${config.text}</span>
          </div>
          <hr>
          <p class="announce-title">${escapeHtml(post.title)}</p>
          <p class="announce-body">${escapeHtml(post.content)}</p>
          <div class="announce-meta">
            <span>โดย: ${escapeHtml(post.author)} • เวลา ${formatTime(post.created_at)}</span>
            ${isOwner ? `<button class="delete-btn" type="button" data-delete="${post.id}">ลบโพสต์</button>` : ''}
          </div>
        </section>
      `;
    }).join('');
  }

  async function deletePost(id) {
    if (!confirm('ต้องการลบโพสต์นี้ใช่หรือไม่?')) return;
    try {
      await request(`${API}/${id}?author=${encodeURIComponent(currentUser)}`, { method: 'DELETE' });
      posts = posts.filter(post => post.id !== id);
      renderFeed();
    } catch (err) {
      alert('ลบไม่สำเร็จ: ' + err.message);
    }
  }

  // ---------- Events ----------
  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    loadPosts();
  });

  feedEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-delete]');
    if (btn) deletePost(Number(btn.dataset.delete));
  });

  document.getElementById('refreshBtn').addEventListener('click', loadPosts);

  document.getElementById('emergencyBtn').addEventListener('click', () => {
    document.getElementById('postType').value = 'alert';
    document.getElementById('postTitle').focus();
  });

  document.getElementById('postForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const author = authorEl.value.trim();
    if (!author) return;

    currentUser = author;
    localStorage.setItem('community_app_user', author);

    const payload = {
      type: document.getElementById('postType').value,
      title: document.getElementById('postTitle').value.trim(),
      content: document.getElementById('postContent').value.trim(),
      author
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังโพสต์...';
    try {
      await request(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      await loadPosts();
    } catch (err) {
      alert('โพสต์ไม่สำเร็จ: ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'โพสต์ลงชุมชน';
    }
  });

  loadPosts();
</script>

</body>
</html>
